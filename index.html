<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAILYFLOW — Daily Planner</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#718096;
  --line:#e7ebf2; --accent:#635bff; --accent2:#4f46e5;
  --success:#16a34a; --danger:#dc2626; --shadow:0 12px 35px rgba(31,41,55,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.app{max-width:1100px;margin:auto;padding:28px 18px 50px}
header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:23px;font-weight:800}
h1{font-size:25px;margin:0}.subtitle{color:var(--muted);font-size:13px;margin-top:3px}
.icon-btn{width:42px;height:42px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:18px;color:var(--text)}
.hero{background:linear-gradient(135deg,#635bff,#8b5cf6);color:white;border-radius:24px;padding:26px;box-shadow:0 18px 45px rgba(99,91,255,.22);margin-bottom:20px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:20px}
.date-title{font-size:22px;font-weight:750}.date-sub{opacity:.82;margin-top:5px}
.progress-wrap{min-width:220px}.progress-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
.progress{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:#fff;border-radius:99px;transition:.3s;width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);border-radius:15px;padding:13px}.stat b{font-size:21px}.stat span{display:block;font-size:12px;opacity:.78}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.primary{background:var(--accent);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700}
.secondary{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 15px}
.filter{margin-left:auto}
.tasks{display:flex;flex-direction:column;gap:11px}
.task{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px 17px;display:flex;align-items:center;gap:14px;box-shadow:0 5px 20px rgba(31,41,55,.035);transition:.2s}
.task.done{opacity:.62}.task.done .task-name{text-decoration:line-through}
.check{width:24px;height:24px;border-radius:8px;border:2px solid #cbd5e1;background:#fff;display:grid;place-items:center;flex:0 0 auto;color:#fff;font-weight:900}
.check.checked{background:var(--success);border-color:var(--success)}
.task-time{font-weight:750;min-width:78px;color:var(--accent)}
.task-main{flex:1;min-width:0}.task-name{font-weight:650}.task-note{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;padding:5px 8px;border-radius:8px;background:#eef2ff;color:var(--accent);font-weight:700}
.actions{display:flex;gap:5px}.small-btn{background:transparent;color:var(--muted);width:32px;height:32px;border-radius:9px}.small-btn:hover{background:#f1f5f9;color:var(--text)}
.empty{background:var(--card);border:1px dashed #cbd5e1;border-radius:18px;padding:45px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:5px}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal-backdrop.show{display:flex}
.modal{width:min(500px,100%);background:var(--card);border-radius:22px;padding:23px;box-shadow:0 25px 70px rgba(0,0,0,.2)}
.modal h2{margin:0 0 18px}.form-grid{display:grid;gap:14px}
label{font-size:13px;font-weight:700;display:grid;gap:7px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none;background:#fff;color:var(--text)}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,91,255,.1)}
textarea{resize:vertical;min-height:75px}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.danger{color:var(--danger)}
@media(max-width:650px){
 .hero-top{display:block}.progress-wrap{margin-top:20px;min-width:0}.stats{grid-template-columns:1fr 1fr 1fr}
 .task{padding:13px 12px;gap:10px}.task-time{min-width:62px;font-size:13px}.badge{display:none}.actions .small-btn{width:28px}
}
</style>
</head>
<body>
<div class="app" id="mainApp" style="display: none;">
  <!-- Auth Section UI -->
<div id="authSection" style="max-width: 400px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; text-align: center;">
  <h2 id="authTitle">Login to DailyFlow</h2>
  <input type="email" id="authEmail" placeholder="Email" style="width: 90%; padding: 8px; margin: 8px 0;" required><br>
  <input type="password" id="authPassword" placeholder="Password" style="width: 90%; padding: 8px; margin: 8px 0;" required><br>
  <button id="authPrimaryBtn" style="padding: 8px 16px; margin-top: 10px; cursor: pointer;">Log In</button>
  <p style="margin-top: 15px; font-size: 14px;">
    <span id="toggleAuthMsg">Don't have an account?</span> 
    <a href="#" id="toggleAuthBtn" style="color: blue; text-decoration: underline;">Sign Up</a>
  </p>
</div>
<header>
  <div class="brand">
    <div class="logo">✓</div>
    <div><h1>DAILYFLOW</h1><div class="subtitle">Plan your day. Finish your work.</div></div>
  </div>
  <button class="icon-btn" id="themeBtn" title="Toggle theme">☾</button>
</header>

<section class="hero">
  <div class="hero-top">
    <div><div class="date-title" id="dateTitle"></div><div class="date-sub">Your daily productivity dashboard</div></div>
    <div class="progress-wrap">
      <div class="progress-label"><span>Today's progress</span><b id="percent">0%</b></div>
      <div class="progress"><div id="bar"></div></div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><b id="total">0</b><span>Total tasks</span></div>
    <div class="stat"><b id="completed">0</b><span>Completed</span></div>
    <div class="stat"><b id="remaining">0</b><span>Remaining</span></div>
  </div>
</section>

<div class="toolbar">
  <button class="primary" id="addBtn">＋ Add task</button>
  <button class="secondary" id="todayBtn">Today</button>
  <select class="secondary filter" id="filter">
    <option value="all">All tasks</option>
    <option value="active">Active</option>
    <option value="done">Completed</option>
  </select>
</div>

<div class="tasks" id="tasks"></div><div style="text-align:center;color:var(--muted);font-size:12px;margin-top:28px;">Owned &amp; created by <strong style="color:var(--text);">MD NAFIS ITTESAM</strong></div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h2 id="modalTitle">Add a task</h2>
    <form id="taskForm">
      <div class="form-grid">
        <label>Task name
          <input id="taskName" required maxlength="100" placeholder="e.g. Study Physics">
        </label>
        <label>Time
          <input id="taskTime" type="time" required>
        </label>
        <label>Note <span style="font-weight:400;color:#718096">(optional)</span>
          <textarea id="taskNote" maxlength="220" placeholder="Add a short note..."></textarea>
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="secondary" id="cancelBtn">Cancel</button>
        <button class="primary" type="submit">Save task</button>
      </div>
    </form>
  </div>
</div>

<script>
const KEY="dailyflow_tasks_v1";
const THEME="dailyflow_theme_v1";
let tasks=JSON.parse(localStorage.getItem(KEY)||"[]");
let editingId=null;

const $=id=>document.getElementById(id);
function todayKey(d=new Date()){return d.toISOString().slice(0,10)}
function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}
function formatDate(){
  const d=new Date();
  $("dateTitle").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
}
function fmtTime(t){
  const [h,m]=t.split(":").map(Number), d=new Date();
  d.setHours(h,m);
  return d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
}
function render(){
  formatDate();
  const today=todayKey();
  let todayTasks=tasks.filter(t=>t.date===today);
  const filter=$("filter").value;
  if(filter==="active") todayTasks=todayTasks.filter(t=>!t.done);
  if(filter==="done") todayTasks=todayTasks.filter(t=>t.done);
  todayTasks.sort((a,b)=>a.time.localeCompare(b.time));
  const allToday=tasks.filter(t=>t.date===today);
  const completed=allToday.filter(t=>t.done).length;
  const pct=allToday.length?Math.round(completed/allToday.length*100):0;
  $("total").textContent=allToday.length;
  $("completed").textContent=completed;
  $("remaining").textContent=allToday.length-completed;
  $("percent").textContent=pct+"%";
  $("bar").style.width=pct+"%";

  const box=$("tasks"); box.innerHTML="";
  if(!todayTasks.length){
    box.innerHTML=`<div class="empty"><strong>${allToday.length?"No tasks in this filter":"Your day is clear ✨"}</strong><span>${allToday.length?"Try another filter.":"Add your first task and start planning."}</span></div>`;
    return;
  }
  todayTasks.forEach(t=>{
    const el=document.createElement("div"); el.className="task"+(t.done?" done":"");
    el.innerHTML=`
      <button class="check ${t.done?"checked":""}" data-action="toggle" data-id="${t.id}" aria-label="Complete task">${t.done?"✓":""}</button>
      <div class="task-time">${fmtTime(t.time)}</div>
      <div class="task-main"><div class="task-name">${esc(t.name)}</div>${t.note?`<div class="task-note">${esc(t.note)}</div>`:""}</div>
      <span class="badge">${t.done?"Done":"Planned"}</span>
      <div class="actions">
        <button class="small-btn" data-action="edit" data-id="${t.id}" title="Edit">✎</button>
        <button class="small-btn danger" data-action="delete" data-id="${t.id}" title="Delete">×</button>
      </div>`;
    box.appendChild(el);
  });
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function openModal(id=null){
  editingId=id;
  $("modalTitle").textContent=id?"Edit task":"Add a task";
  if(id){
    const t=tasks.find(x=>x.id===id);
    $("taskName").value=t.name;$("taskTime").value=t.time;$("taskNote").value=t.note||"";
  }else{
    $("taskForm").reset();
    const now=new Date(); now.setMinutes(Math.ceil(now.getMinutes()/5)*5);
    $("taskTime").value=now.toTimeString().slice(0,5);
  }
  $("modal").classList.add("show"); $("taskName").focus();
}
function closeModal(){ $("modal").classList.remove("show"); editingId=null }
$("addBtn").onclick=()=>openModal();
$("cancelBtn").onclick=closeModal;
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});
$("filter").onchange=render;
$("todayBtn").onclick=()=>{ $("filter").value="all"; render(); window.scrollTo({top:0,behavior:"smooth"}) };
$("taskForm").onsubmit=e=>{
  e.preventDefault();
  const data={name:$("taskName").value.trim(),time:$("taskTime").value,note:$("taskNote").value.trim()};
  if(editingId){
    const t=tasks.find(x=>x.id===editingId); Object.assign(t,data);
  }else{
    tasks.push({id:Date.now().toString(),date:todayKey(),done:false,...data});
  }
  save();render();closeModal();
};
$("tasks").onclick=e=>{
  const btn=e.target.closest("[data-action]"); if(!btn)return;
  const id=btn.dataset.id, action=btn.dataset.action;
  const t=tasks.find(x=>x.id===id); if(!t)return;
  if(action==="toggle")t.done=!t.done;
  if(action==="edit")return openModal(id);
  if(action==="delete" && confirm("Delete this task?"))tasks=tasks.filter(x=>x.id!==id);
  save();render();
};
$("themeBtn").onclick=()=>{
  const dark=document.body.classList.toggle("dark");
  localStorage.setItem(THEME,dark?"dark":"light"); applyTheme();
};
function applyTheme(){
  const dark=localStorage.getItem(THEME)==="dark";
  document.body.classList.toggle("dark",dark);
  $("themeBtn").textContent=dark?"☀":"☾";
}
const darkStyle=document.createElement("style");
darkStyle.textContent=`body.dark{--bg:#0f172a;--card:#172033;--text:#f1f5f9;--muted:#94a3b8;--line:#263247}body.dark input,body.dark textarea,body.dark select{background:#111827;color:#f1f5f9}body.dark .secondary,body.dark .icon-btn{background:#172033;color:#f1f5f9}body.dark .check{background:#172033;border-color:#475569}`;
document.head.appendChild(darkStyle);
applyTheme();render();
</script>
<!-- Firebase & Firestore Integration Script -->

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Your Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyD6emOj7NK3UYBeAfuX3kdyZICb1ohYK4o",
    authDomain: "dailyflow-app-191e7.firebaseapp.com",
    projectId: "dailyflow-app-191e7",
    storageBucket: "dailyflow-app-191e7.firebasestorage.app",
    messagingSenderId: "991769469867",
    appId: "1:991769469867:web:f4fb1c8a1ef6c19d2aa8ee",
    measurementId: "G-YNRC1MWZRZ"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  console.log("Firebase Connected Successfully to DAILYFLOW!");
 const mainApp = document.getElementById("mainApp");
const authSection = document.getElementById("authSection");

onAuthStateChanged(auth, (user) => {
  if (user) {
    authSection.style.display = "none";
    mainApp.style.display = "block";
  } else {
    authSection.style.display = "block";
    mainApp.style.display = "none";
  }
});
  // DOM Elements
  const authEmail = document.getElementById("authEmail");
  const authPassword = document.getElementById("authPassword");
  const authPrimaryBtn = document.getElementById("authPrimaryBtn");
  const toggleAuthBtn = document.getElementById("toggleAuthBtn");
  const toggleAuthMsg = document.getElementById("toggleAuthMsg");
  const authTitle = document.getElementById("authTitle");

  let isSignUpMode = false;

  // Toggle between Login and Sign Up
  toggleAuthBtn.addEventListener("click", (e) => {
    e.preventDefault();
    isSignUpMode = !isSignUpMode;
    if (isSignUpMode) {
      authTitle.innerText = "Create DailyFlow Account";
      authPrimaryBtn.innerText = "Sign Up";
      toggleAuthMsg.innerText = "Already have an account?";
      toggleAuthBtn.innerText = "Log In";
    } else {
      authTitle.innerText = "Login to DailyFlow";
      authPrimaryBtn.innerText = "Log In";
      toggleAuthMsg.innerText = "Don't have an account?";
      toggleAuthBtn.innerText = "Sign Up";
    }
  });

  // Handle Authentication Action
  authPrimaryBtn.addEventListener("click", async () => {
    const email = authEmail.value;
    const password = authPassword.value;

    if (!email || !password) {
      alert("Please enter both email and password.");
      return;
    }

    try {
      if (isSignUpMode) {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        alert("Account created successfully! Welcome " + userCredential.user.email);
      } else {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        alert("Logged in successfully! Welcome " + userCredential.user.email);
      }
    } catch (error) {
      alert("Authentication Error: " + error.message);
    }
  });
</script>
</body>
</html>
